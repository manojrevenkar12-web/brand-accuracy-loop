name: ci
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e '.[dev]'
      - run: ruff check src tests scripts && ruff format --check src tests scripts
      - run: python -m pytest -q
      - name: The evaluation reproduces the committed report and model
        run: |
          python scripts/evaluate.py
          git diff --exit-code reports/dev.json models/verifier.json examples/vault.json
      - name: Quality gate
        run: |
          python - <<'PY'
          import json
          v = json.load(open("reports/dev.json"))["verification"]
          t, r = v["trained"], v["rules"]
          assert t["wrong_claims_caught"] >= 99.0, t["wrong_claims_caught"]
          assert t["false_alarms_per_1k_claims"] < r["false_alarms_per_1k_claims"] / 5, t
          assert max(t["error_by_language"].values()) <= 1.0, t["error_by_language"]
          PY
      - name: README and dashboard data match the reports
        run: |
          python scripts/readme.py
          git diff --exit-code README.md web/public/data/console.json
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t brand-accuracy-loop .
      - name: The container answers
        run: |
          docker run -d -p 8080:8080 --name api brand-accuracy-loop
          for i in $(seq 1 30); do curl -sf localhost:8080/healthz && break; sleep 1; done
          curl -sf localhost:8080/healthz || (docker logs api; exit 1)
  terraform:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: infra/terraform } }
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check
      - run: terraform init -backend=false && terraform validate
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: npm test
