# The held-out world: other brands, a fifth engine, more German, phrasings the extractor was not written for.
# Runs once (scripts/evaluate.py --heldout), with the verifier trained on the dev world. See AGENTS.md.
seed = 29
templates = "heldout"
brands = 30
products_per_brand = [2, 3]
categories = ["headphones", "laptop", "ebike", "coffee_machine", "credit_card"]
vault_coverage = 0.88        # share of facts the brand has verified in its vault
vault_history = 0.8          # share of changed facts whose old value the vault also records
change_share = 0.35          # share of facts that changed in the last 400 days
prompts_train = 700          # prompts whose answers the annotators label
prompts_eval = 320           # prompts the designs are measured on
german_share = 0.4           # share of de-DE prompts in the eval set
german_share_train = 0.1     # annotators mostly read English
en_de_share = 0.12           # English prompts asked from Germany (euro prices)
weeks = 8
annotator_noise = 0.05       # share of labels an annotator gets wrong
reviewer_noise = 0.01        # second-pass reviewers, for claims a design sends to people
spam_share = 0.2            # products with a page written to mislead AI assistants
fix_success = { brand = 1.0, review = 0.55, forum = 0.4, retail = 0.6, spam = 0.1, feed = 0.6 }

[engines.chat]
k = 4
memory = 0.30
invent = 0.12
cutoff_day = -150
cite_cause = 0.65
cite_other = 0.5
dollar_in_en_de = 0.15
style = { exact = 0.55, approx = 0.3, bound = 0.15 }
weights = { official = 0.8, review = 1.2, forum = 1.3, retail = 0.6, spam = 0.9 }

